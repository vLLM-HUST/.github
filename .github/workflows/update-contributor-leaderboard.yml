name: Update Contributor Data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [contributor-update]
  push:
    branches: [main]
    paths:
      - '.mailmap'
      - 'scripts/update_contributor_leaderboard.py'
  schedule:
    - cron: '0 2 * * 1'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout org profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git for token auth
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update contributor data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_contributor_leaderboard.py --ci

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-contributor-leaderboard
          commit-message: 'docs: refresh contributor data'
          title: 'docs: refresh contributor data'
          body: |
            Automated weekly update of structured organization contributor data.

            Changes:
            - Updated `profile/core_contributors.json` data export
          delete-branch: true
